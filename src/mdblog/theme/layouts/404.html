{{ define "head" }}
{{- /* mdblog verify looks for this marker to tell the site's own 404 page from a host's
       default one. A meta element keeps it out of the reader's view. */}}
<meta name="mdblog-not-found" content="{{ site.Params.mdblog_not_found_marker }}">
{{- end }}
{{ define "main" }}
<section class="not-found">
<h1>Page not found</h1>
<p>Nothing is published at this address.</p>
<p><a href="{{ site.Home.RelPermalink }}">Go to the home page</a></p>
</section>
{{ end }}
