{{ define "main" }}
<h1>Tags</h1>
{{- $terms := slice }}
{{- range .Data.Terms }}
{{- $terms = $terms | append (dict "name" (lower .Page.Data.Term) "page" .Page "count" .Count) }}
{{- end }}
<ul class="tag-list">
{{- range sort $terms "name" }}
<li><a class="tag" href="{{ .page.RelPermalink }}">{{ .name }} <span class="tag-count">{{ .count }}</span></a></li>
{{- end }}
</ul>
{{ end }}
