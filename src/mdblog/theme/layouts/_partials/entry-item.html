<article class="h-entry entry-item">
<header class="entry-header">
<h2 class="p-name"><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ with partial "entry-status.html" . }} {{ . }}{{ end }}</h2>
{{ partial "entry-meta.html" (dict "page" . "listed" true) }}
</header>
<div class="p-summary entry-summary">
{{ (partial "summary.html" .).html }}
</div>
</article>
