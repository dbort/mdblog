{{- /* Only draft mode marks a page either way, because vault properties never reach
       Hugo. A published page renders nothing here, so its markup matches the live
       site's. */ -}}
{{- if .Draft }}<span class="entry-status entry-status-draft">Draft</span>
{{- else if .Params.mdblog_invalid }}<span class="entry-status entry-status-invalid">Invalid</span>
{{- end -}}
