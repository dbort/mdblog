{{ define "main" }}
{{- $latest := 15 }}
{{- with .Content }}
<section class="bio">
{{ . }}
</section>
{{- end }}
<section class="h-feed entry-list">
{{- range first $latest site.RegularPages }}
{{ partial "entry-item.html" . }}
{{- end }}
</section>
{{- with site.GetPage "/posts" }}
<p class="more"><a href="{{ .RelPermalink }}">All entries</a></p>
{{- end }}
{{ end }}
