<!doctype html>
<html>
  <head>
    <title>{{ .Site.Title }}</title>
    <meta name="author" content="{{ .Site.Params.author }}">
  </head>
  <body>
    {{ .Content }}
    <ul>
      {{ range .Site.RegularPages }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}
    </ul>
  </body>
</html>
