{{ define "main" }}
<h1>Archive</h1>
{{- range .Pages.GroupByDate "2006" }}
<section class="archive-year">
<h2>{{ .Key }}</h2>
<ul class="archive-list">
{{- range .Pages }}
<li>{{ partial "entry-label.html" . }} <a href="{{ .RelPermalink }}">{{ .Title }}</a> {{ partial "date.html" . }}</li>
{{- end }}
</ul>
</section>
{{- end }}
{{ end }}
