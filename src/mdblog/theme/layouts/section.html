{{ define "main" }}
<h1>All posts</h1>
{{- range .Pages.GroupByDate "2006" }}
<section class="archive-year">
<h2>{{ .Key }}</h2>
<ul class="archive-list">
{{- range .Pages }}
<li><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ with partial "entry-status.html" . }} {{ . }}{{ end }} {{ partial "date.html" . }}</li>
{{- end }}
</ul>
</section>
{{- end }}
{{ end }}
